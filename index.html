<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blockchain — Iniciar sesión</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    background: radial-gradient(circle at 50% 0%, #151530, #05050f 70%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .phone {
    width: 375px; height: 812px;
    background: #0a0a18;
    border-radius: 40px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px #1e1e3a;
    display: flex; flex-direction: column;
  }
  /* Formas decorativas 3D azules */
  .blob { position: absolute; filter: blur(2px); opacity: .9; pointer-events: none; }
  .blob1 { top: -40px; left: -60px; width: 220px; height: 220px;
    background: conic-gradient(from 200deg, #1e3cff, #7b2fff, #00d4ff, #1e3cff);
    border-radius: 40% 60% 55% 45% / 50% 40% 60% 50%; filter: blur(20px); opacity:.55; }
  .blob2 { top: -30px; right: -70px; width: 240px; height: 240px;
    background: conic-gradient(from 40deg, #ff2fb3, #1e3cff, #00d4ff, #ff2fb3);
    border-radius: 55% 45% 40% 60% / 45% 55% 45% 55%; filter: blur(22px); opacity:.5; }
  .blob3 { bottom: -60px; left: -50px; width: 260px; height: 260px;
    background: conic-gradient(from 300deg, #00d4ff, #7b2fff, #1e3cff, #00d4ff);
    border-radius: 60% 40% 55% 45% / 40% 60% 40% 60%; filter: blur(24px); opacity:.35; }

  .screen {
    position: relative; z-index: 2; flex: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 90px 30px 30px;
  }
  .hidden { display: none; }

  .brand-logo img { width: 64px; height: 64px; display: block; margin: 0 auto 12px; }
  .brand-name {
    font-size: 26px; font-weight: 800; letter-spacing: 2px;
    color: #fff; text-align: center; margin-bottom: 34px;
  }
  h1 { color: #fff; font-size: 22px; font-weight: 800; text-align: center; letter-spacing: 1px; margin-bottom: 8px; }
  .subtitle { color: #8b8ba7; font-size: 13px; margin-bottom: 26px; }

  .field {
    width: 100%; background: #12122a;
    border: 1px solid #232348; border-radius: 10px;
    display: flex; align-items: center; gap: 10px;
    padding: 14px 14px; margin-bottom: 14px;
  }
  .field input {
    flex: 1; background: none; border: none; outline: none;
    color: #cfd0e8; font-size: 14px;
  }
  .field input::placeholder { color: #5a5a7d; }
  .field:focus-within { border-color: #3d5bff; box-shadow: 0 0 0 3px rgba(61,91,255,.15); }

  .options {
    width: 100%; display: flex; justify-content: space-between;
    align-items: center; margin: 4px 0 22px; font-size: 12px;
  }
  .remember { display: flex; align-items: center; gap: 7px; color: #9a9ab8; cursor: pointer; }
  .remember input { accent-color: #3d5bff; width: 14px; height: 14px; }
  .options a { color: #6f7bff; text-decoration: none; }

  .btn-login {
    width: 100%; padding: 15px; border: none; border-radius: 10px;
    background: linear-gradient(90deg, #2b4bff, #6a3dff);
    color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 2px;
    cursor: pointer; transition: .25s;
    box-shadow: 0 8px 24px rgba(61,91,255,.35);
  }
  .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(106,61,255,.5); }

  .divider { width: 100%; display: flex; align-items: center; gap: 12px; margin: 24px 0; color: #6a6a8f; font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #232348; }

  .socials { width: 100%; display: flex; gap: 12px; }
  .btn-social {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: #15152e; border: 1px solid #26264a; border-radius: 10px;
    color: #d5d5ea; font-size: 13px; padding: 13px; cursor: pointer; transition: .2s;
  }
  .btn-social:hover { border-color: #3d5bff; }

  .footer { margin-top: auto; color: #8b8ba7; font-size: 13px; }
  .footer a { color: #6f7bff; text-decoration: none; font-weight: 600; }

  /* ---- Pantalla PIN ---- */
  .back { position: absolute; top: 26px; left: 24px; color: #9a9ab8; font-size: 20px; cursor: pointer; z-index: 3; }
  .pin-dots { display: flex; gap: 14px; margin: 26px 0 14px; }
  .pin-dots span {
    width: 44px; height: 44px; border-radius: 10px;
    background: #14142c; border: 1px solid #26264a;
    display: flex; align-items: center; justify-content: center;
  }
  .pin-dots span.filled::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #fff; }
  .forgot-pin { color: #6f7bff; font-size: 12px; text-decoration: none; margin-bottom: 26px; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 46px; margin-top: 6px; }
  .key {
    width: 62px; height: 62px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #e8e8f5; font-size: 20px; cursor: pointer; transition: .15s;
    border: 1px solid transparent;
  }
  .key:hover { background: #181836; border-color: #2c2c55; }
  .key:active { transform: scale(.92); }
  .keypad-icons { width: 100%; display: flex; justify-content: space-between; padding: 0 8px; margin-top: 8px; color: #8b8ba7; font-size: 18px; }
</style>
<base target="_blank">
</head>
